import org.example.tasks.*

plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0'

repositories {
    mavenCentral()
}

def srcDir = 'src/main/java'
def testSrcDir = 'src/test/java'
def srcClassesDir = layout.buildDirectory.dir("classes/java/main")
def testClassDir = layout.buildDirectory.dir("classes/java/test")
def outJarFile = layout.buildDirectory.file("libs/${project.name}.jar")
def outWarFile = layout.buildDirectory.file("libs/${project.name}.war")
def webappDir = layout.projectDirectory.dir("src/main/webapp")
def resourcesDir = layout.projectDirectory.dir("src/main/resources")
def soundFile = layout.projectDirectory.file("music/sound-success.wav")


tasks.register("myCompile", MyCompileTask) {
    group = 'opi-lab3'
    description = 'компиляция исходных кодов проекта'

    sources.from(fileTree(dir: srcDir, includes: ['**/*.java']))
    classesDir = srcClassesDir
}

tasks.register("myWar", MyWarTask) {
    group = 'opi-lab3'
    description = 'сборка war-архива'

    dependsOn("myCompile")

    classesDir = srcClassesDir
    it.webappDir = webappDir
    it.resourcesDir = resourcesDir
    warFile = outWarFile
    runtimeClasspath.from(configurations.runtimeClasspath)
}

tasks.register("myBuild", MyBuildTask) {
    group = 'opi-lab3'
    description = 'сборка исполняемого jar со встроенным war и лаунчером wildfly'

    dependsOn("myWar")

    warFile = outWarFile
    classesDir = srcClassesDir
    jarFile = outJarFile
    appVersion.set(project.findProperty('projVersion') ?: version)
    wildflyHome.set(project.findProperty('wildfly.home') ?: '/opt/wildfly')
}

tasks.register("myClean", MyCleanTask) {
    group = 'opi-lab3'
    description = 'удаление скомпилированных классов и временных файлов'
}

tasks.register("myCompileTest", MyCompileTestsTask) {
    group = 'opi-lab3'
    description = 'компиляция тестовых файлов'

    dependsOn("myCompile")

    testSources.from(fileTree(dir: testSrcDir, includes: ['**/*.java']))
    mainClassesDir = srcClassesDir
    testClassesDir = testClassDir
}

tasks.register("myTest", MyTestTask) {
    group = 'opi-lab3'
    description = 'запуск junit-тестов проекта'

    dependsOn("myCompileTest")

    mainClassesDir = srcClassesDir
    testClassesDir = testClassDir
}

tasks.register("music", MusicTask) {
    group = 'opi-lab3'
    description = 'воспроизведение музыки по завершению сборки'

    dependsOn("myBuild")

    it.soundFile = soundFile
}

tasks.register("env", EnvTask) {
    group = 'opi-lab3'
    description = 'сборка и запуск в альтернативном окружении'

    dependsOn("myBuild")

    jarFile = outJarFile
    javaExecutable = (project.findProperty('env.java.executable') ?: 'java') as String
    jvmArgs = ((project.findProperty('env.jvm.args') ?: '') as String)
            .split(' ').findAll { !it.trim().isEmpty() }
    appArgs = ((project.findProperty('env.app.args') ?: '') as String)
            .split(' ').findAll { !it.trim().isEmpty() }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-console'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    implementation 'jakarta.faces:jakarta.faces-api:3.0.0'
    implementation 'org.glassfish:jakarta.faces:3.0.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.primefaces:primefaces:12.0.0:jakarta'
    implementation 'jakarta.el:jakarta.el-api:5.0.0'
    implementation 'org.hibernate:hibernate-gradle-plugin:5.6.15.Final'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:3.0.0'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.0'
    implementation 'com.google.code.gson:gson:2.7'

    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'
}

test { useJUnitPlatform() }
war { webAppDirName = 'src/main/webapp' }